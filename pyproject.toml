[project]
name = "cricket-all-leagues-ai-lakehouse"
version = "0.1.0"
description = "Databricks medallion lakehouse for all-league ball-by-ball cricket JSON."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

