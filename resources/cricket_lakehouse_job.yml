resources:
  jobs:
    cricket_all_leagues_lakehouse_job:
      name: cricket-all-leagues-lakehouse-${bundle.target}
      performance_target: STANDARD

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies: []

      tasks:
        - task_key: bronze_ingest_raw_matches
          environment_key: default
          spark_python_task:
            python_file: ../src/cricket_lakehouse/bronze/ingest_raw_matches.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --table-prefix
              - ${var.table_prefix}
              - --source-path
              - ${var.source_path}

        - task_key: silver_build_matches
          depends_on:
            - task_key: bronze_ingest_raw_matches
          environment_key: default
          spark_python_task:
            python_file: ../src/cricket_lakehouse/silver/build_matches.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --table-prefix
              - ${var.table_prefix}

        - task_key: silver_build_deliveries
          depends_on:
            - task_key: bronze_ingest_raw_matches
          environment_key: default
          spark_python_task:
            python_file: ../src/cricket_lakehouse/silver/build_deliveries.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --table-prefix
              - ${var.table_prefix}

        - task_key: gold_build_analytics
          depends_on:
            - task_key: silver_build_matches
            - task_key: silver_build_deliveries
          environment_key: default
          spark_python_task:
            python_file: ../src/cricket_lakehouse/gold/build_analytics.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --table-prefix
              - ${var.table_prefix}
