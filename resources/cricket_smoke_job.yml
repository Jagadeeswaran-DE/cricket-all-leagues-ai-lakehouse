resources:
  jobs:
    cricket_all_leagues_smoke_job:
      name: cricket-all-leagues-smoke-${bundle.target}
      performance_target: STANDARD

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies: []

      tasks:
        - task_key: bronze_ingest_raw_matches
          environment_key: default
          spark_python_task:
            python_file: ../src/cricket_lakehouse/bronze/ingest_raw_matches.py
            parameters:
              - --catalog
              - cricket
              - --schema
              - cricket_all
              - --table-prefix
              - smoke_
              - --source-path
              - /Volumes/cricket/cricket_all/cricket_all_raw/extracted/829765.json

        - task_key: silver_build_matches
          depends_on:
            - task_key: bronze_ingest_raw_matches
          environment_key: default
          spark_python_task:
            python_file: ../src/cricket_lakehouse/silver/build_matches.py
            parameters:
              - --catalog
              - cricket
              - --schema
              - cricket_all
              - --table-prefix
              - smoke_

        - task_key: silver_build_deliveries
          depends_on:
            - task_key: bronze_ingest_raw_matches
          environment_key: default
          spark_python_task:
            python_file: ../src/cricket_lakehouse/silver/build_deliveries.py
            parameters:
              - --catalog
              - cricket
              - --schema
              - cricket_all
              - --table-prefix
              - smoke_

        - task_key: gold_build_analytics
          depends_on:
            - task_key: silver_build_matches
            - task_key: silver_build_deliveries
          environment_key: default
          spark_python_task:
            python_file: ../src/cricket_lakehouse/gold/build_analytics.py
            parameters:
              - --catalog
              - cricket
              - --schema
              - cricket_all
              - --table-prefix
              - smoke_
